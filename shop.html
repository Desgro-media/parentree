<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all — Momira Organic</title>
<meta name="description" content="Browse organic cotton night suits, frocks, swaddles, joggers, gift sets and newborn essentials from Momira Organic.">
<meta name="theme-color" content="#F9F1E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C9 6 5 12 5 19c0 5 3 9 8 10 0-9 2-15 5-19-1 6-1 12-1 18 6-1 12-6 12-15C29 8 25 4 16 3Z' fill='%23566752'/%3E%3C/svg%3E">
</head>
<body data-page="shop">
<main>
  <section class="shop-hero">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> SPRITE_CHEVRIGHT <span id="crumbNow">Shop all</span></nav>
      <h1 id="shopTitle">All products</h1>
      <p id="shopDesc">Every Momira piece — GOTS-certified organic cotton, plant-dyed, made to be handed down.</p>
    </div>
  </section>

  <div class="container">
    <div class="shop-toolbar">
      <div class="cat-rail" id="shopCats"></div>
      <div class="shop-toolbar__end">
        <span class="shop-toolbar__count" id="shopCount">—</span>

        <div class="price-filter">
          <button class="chip" id="priceBtn" type="button" aria-expanded="false" aria-controls="pricePop">
            <span id="priceBtnLabel">Price</span> SPRITE_CHEVDOWN
          </button>
          <div class="price-pop" id="pricePop" hidden>
            <div class="price-pop__row">
              <span>₹<span id="priceMinLabel">0</span></span>
              <span>₹<span id="priceMaxLabel">4000</span></span>
            </div>
            <div class="price-slider">
              <div class="price-slider__track"></div>
              <div class="price-slider__fill" id="priceFill"></div>
              <input type="range" id="priceMin" min="0" max="4000" step="100" value="0" aria-label="Minimum price">
              <input type="range" id="priceMax" min="0" max="4000" step="100" value="4000" aria-label="Maximum price">
            </div>
            <div class="price-pop__presets">
              <button type="button" data-preset="0,1000">Under ₹1,000</button>
              <button type="button" data-preset="1000,2000">₹1,000–2,000</button>
              <button type="button" data-preset="2000,4000">₹2,000+</button>
            </div>
            <button class="link-more" id="priceReset" type="button">Reset price SPRITE_CLOSE</button>
          </div>
        </div>

        <div class="select-wrap">
          <select id="sortSelect" aria-label="Sort products">
            <option value="popular">Most loved</option>
            <option value="new">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="discount">Biggest saving</option>
          </select>
          SPRITE_CHEVDOWN
        </div>
      </div>
    </div>

    <section class="section" style="padding-top:8px">
      <div class="product-grid product-grid--4" id="shopGrid"></div>
      <div class="empty-state" id="shopEmpty" hidden>
        SPRITE_BAG
        <h3>Nothing here yet</h3>
        <p>Try another category or clear your filters.</p>
        <a class="btn btn--outline btn--sm" href="shop.html" style="margin-top:16px">View all products</a>
      </div>
    </section>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
